name: Device tests (emulator)
# 1.4.2: real-device style checks on Android emulators, on every push to main / v1.4 and on pull requests.
#  - agent-e2e: an agent drives the background screen through the HTTP API (launch, look, act, busy, release),
#    the user's main screen stays untouched, the app never crashes (tools/android-smoke/agent_e2e.py), on
#    Android 11 (no own display group: screen sleeps with the phone) and Android 14 (own display group).
#  - shizuku: granting Shizuku on a fresh install and after the 1.3 -> 1.4 -> candidate upgrade path survives a
#    relaunch (tools/android-smoke/shizuku.py).
on:
  push:
    branches: [main, v1.4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - run: ./tsbridge/build.sh
      # Debug: carries the CI hook (src/debug) that hands the test its token; release APKs never do.
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: candidate
          path: |
            ${{ env.AVS_BUILD_DIR }}/app/outputs/apk/debug/app-debug.apk
            ${{ env.AVS_BUILD_DIR }}/app/outputs/apk/release/app-release.apk
          retention-days: 3
  agent-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Our native code is arm64 only, so the x86_64 emulator runs it through the arm64 translator. The API 30
        # translator aborts on an FPCR write (fp16 OCR); API 31+ translators handle it. Real phones are not affected.
        api: [31, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch Shizuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/agent_e2e.py test-apks/app-debug.apk 2>&1 | tee e2e.log; grep -q '^SUMMARY all passed' e2e.log || { adb logcat -d > logcat.txt; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.api }}-logs
          path: |
            e2e.log
            logcat.txt
          retention-days: 7
  shizuku:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        path: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: candidate
          path: test-apks
      - name: Fetch public releases
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PATH: ${{ matrix.path }}
        run: |
          find test-apks -name '*.apk' -exec mv {} test-apks/ \;
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern '*.apk' --output test-apks/shizuku.apk
          if [[ "$TEST_PATH" == upgrade ]]; then
            for version in 1.3.0 1.4.0; do
              gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output "test-apks/$version.apk"
            done
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/android-smoke/shizuku.py ${{ matrix.path }}
