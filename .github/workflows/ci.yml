# CI for Agent-VScreen. Free on public repositories. It only checks and builds: nothing is signed with the release
# key (the release APK falls back to the debug key when keystore.properties is absent) and nothing is published.
name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # build.sh / build.gradle.kts put outputs under $AVS_BUILD_DIR (older trees: fixed /srv/avs-build, linked below).
  AVS_BUILD_DIR: ${{ github.workspace }}/.avs-build

jobs:
  android:
    name: Generated files, unit tests, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build dir
        run: |
          mkdir -p "$AVS_BUILD_DIR/tmp" "$AVS_BUILD_DIR/logs"
          # Trees before 1.4.1 hardcode /srv/avs-build in build.gradle.kts: point it at the workspace.
          sudo ln -sfn "$AVS_BUILD_DIR" /srv/avs-build

      - name: Built-in Tailscale node (tsbridge)
        run: ./tsbridge/build.sh

      - name: OCR assets read on the app's onnxruntime
        run: |
          ORT=$(grep -o 'onnxruntime-android:[0-9.]*' app/build.gradle.kts | cut -d: -f2)
          pip install --quiet "onnxruntime==$ORT" numpy pillow
          python tools/ocr-bench/check_assets.py app/src/main/assets/vscreen-ocr "$ORT"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Same as `./build.sh regen`: tests rewrite the files generated from the tables, then the tree must be unchanged.
      - name: Unit tests (with regen)
        env:
          AVS_REGEN: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git --no-pager diff --stat
            echo "::error::Generated files are stale. Run ./build.sh regen and commit the result."
            exit 1
          fi

      - name: Debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .avs-build/app/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: .avs-build/app/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

  operit:
    name: Operit ToolPkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          find integrations/operit/dist -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool integrations/operit/manifest.json > /dev/null
      - name: Pack
        run: ./integrations/operit/build.sh "$RUNNER_TEMP/agent-vscreen.toolpkg"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI (MIT) directly, not the gitleaks GitHub Action, so no license key is ever needed.
      - name: Scan full history
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
